<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kebab in arrivo</title>
<style>
/* Layout: one 16:9 stage centred on a dark set, transport controls underneath. */
:root {
  --set: #0d1514;
  --panel: #15201f;
  --line: #26403c;
  --fg: #e6f1ef;
  --muted: #8eaaa5;
  --teal: #00ccbc;
  --teal-ink: #062b28;
  --display: "Bricolage Grotesque", "Arial Black", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--set); color: var(--fg); font: 500 15px/1.4 var(--body); }
.wrap {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding-block: 20px; padding-inline: 16px;
}
.head, .frame, .controls { width: min(100%, 1280px, calc((100vh - 170px) * 16 / 9)); min-width: min(100%, 320px); }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font: 800 22px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .7), 0 0 0 1px var(--line); }
canvas { display: block; width: 100%; height: 100%; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; min-width: 40px; padding: 0 12px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 700 14px var(--body); cursor: pointer;
}
.btn:hover { border-color: var(--teal); }
.btn:focus-visible, input[type="range"]:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
.btn[disabled] { opacity: .6; cursor: progress; }
.scrub { flex: 1 1 200px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--teal); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
.status { width: 100%; color: var(--muted); font-size: 13px; min-height: 1.4em; }
body.clean { overflow: hidden; }
body.clean .wrap { padding: 0; gap: 0; }
body.clean .head, body.clean .controls { display: none; }
body.clean .frame { width: 100vw; height: 100vh; min-width: 0; max-width: none; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>Kebab in arrivo</h1>
    <p>Spot concept · 1920 × 1080 · 16:9 · 13,5 s</p>
  </header>
  <div class="frame"><canvas id="stage" width="1920" height="1080" aria-label="Spot animato: si ordina un kebab dal telefono, si apre la porta e il rider Abdul consegna il kebab."></canvas></div>
  <div class="controls">
    <button class="btn" id="play" type="button" aria-label="Pausa"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button class="btn" id="restart" type="button" aria-label="Ricomincia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
    <div class="scrub">
      <input id="scrub" type="range" min="0" max="13.5" step="0.01" value="0" aria-label="Posizione nella timeline">
      <span class="time" id="time">0,00 / 13,50 s</span>
    </div>
    <button class="btn primary" id="export" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6V3zM5 19h14v2H5z"/></svg>Esporta video</button>
    <div class="status" id="status" role="status"></div>
  </div>
</div>

<script>
'use strict';
/* ------------------------------------------------------------------ *
 * Timeline. Every frame is a pure function of t, so the spot can be
 * scrubbed, seeked by an exporter, or recorded in real time.
 * ------------------------------------------------------------------ */
const W = 1920, H = 1080, DUR = 13.5, FPS = 60;
const TAU = Math.PI * 2;

const T = {
  phoneIn: [0, 0.95],
  cap1: [0.25, 1.95], cap2: [2.08, 2.8], cap3: [2.92, 4.2],
  handIn: [0.95, 1.45], tap: 1.68, handOut: [1.92, 2.45],
  toConfirm: [2.02, 2.38], check: [2.3, 2.66],
  toTrack: [2.8, 3.12], ride: [3.0, 4.05],
  zoom: [4.0, 4.82], reveal: [4.26, 4.92],
  feet: 4.9, din: 5.05, don: 5.38, handle: [5.8, 6.05], door: [6.0, 7.25],
  wave: [6.8, 8.0], push: [7.8, 8.7],
  bubble: [8.55, 10.1], reach: [9.05, 10.12],
  wipe: [10.2, 10.78], hero: [10.2, 11.15],
  endText: 10.75, settle: 12.9
};

const C = {
  teal: '#00CCBC', tealDeep: '#00AE9F', tealDark: '#007D73', tealPale: '#DDF7F4',
  ink: '#0F2422', grey: '#5A6B69', line: '#E1E8E6',
  skin: '#8A5A3C', skinShade: '#6E432A', skinLight: '#A26D4B',
  hair: '#1B1311', hairHi: '#4A372F', gold: '#E2B24C',
  pants: '#26323B', shoe: '#171C21',
  userSkin: '#E0A67F', userShade: '#C68862', nail: '#F2CDB4', sleeve: '#33404B',
  wallTop: '#DCE3D1', wallBot: '#C6D0BB', floor: '#B07F55', floorLine: '#946640',
  trim: '#F1EEE7', trimShade: '#D6D1C6',
  door: '#6B4229', doorPanel: '#7A4D31', doorDeep: '#4B2B18', brass: '#D6AA4C',
  landTop: '#F7DFA9', landBot: '#E7BE78', cotto: '#C2693F', cottoLine: '#A65632',
  tomato: '#E4463A', lettuce: '#6BBE48', lettuceDark: '#4C9631', onion: '#9A4C8E', meat: '#8A4A2A', meatDark: '#62321A', sauce: '#FBF8F1'
};

const DISPLAY = '"Bricolage Grotesque", "Arial Black", Arial, sans-serif';
const BODY = '"Figtree", "Helvetica Neue", Arial, sans-serif';
const font = (w, px, fam = DISPLAY) => `${w} ${px}px ${fam}`;

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  inOut: x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  outBack: (x, s = 1.4) => (x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2))
};

/* keyframes: [[time, value], ...] with numeric or {x,y} values */
function kf(t, keys, ease = E.inOut) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, v0] = keys[i], [t1, v1] = keys[i + 1];
    if (t <= t1) {
      const e = ease(prog(t, t0, t1));
      if (typeof v0 === 'number') return lerp(v0, v1, e);
      return { x: lerp(v0.x, v1.x, e), y: lerp(v0.y, v1.y, e) };
    }
  }
  return keys[keys.length - 1][1];
}

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function dot(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function txt(c, s, x, y, f, col, align = 'left', ls = 0) {
  c.font = f; c.fillStyle = col; c.textAlign = align; c.textBaseline = 'alphabetic';
  c.letterSpacing = ls + 'px'; c.fillText(s, x, y); c.letterSpacing = '0px';
}
function seg(c, a, b) { c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke(); }
function bez(p0, p1, p2, p3, u) {
  const v = 1 - u;
  return {
    x: v * v * v * p0.x + 3 * v * v * u * p1.x + 3 * v * u * u * p2.x + u * u * u * p3.x,
    y: v * v * v * p0.y + 3 * v * v * u * p1.y + 3 * v * u * u * p2.y + u * u * u * p3.y
  };
}

/* ------------------------------------------------------------------ *
 * The kebab. Origin at its centre, ~330 units tall, opening upward.
 * ------------------------------------------------------------------ */
const KEBAB_BODY = new Path2D('M-90 -108 Q0 -72 90 -108 C86 -30 48 108 8 158 Q0 166 -8 158 C-48 108 -86 -30 -90 -108 Z');

function frill(c, x1, x2, y, r, col, ph) {
  c.fillStyle = col; c.beginPath();
  const n = Math.max(2, Math.round((x2 - x1) / (r * 1.05)));
  for (let i = 0; i <= n; i++) {
    const x = x1 + (x2 - x1) * i / n, yy = y - Math.sin(i * 1.9 + ph) * r * 0.38;
    c.moveTo(x + r, yy); c.arc(x, yy, r, 0, TAU);
  }
  c.fill();
}

function drawKebab(c, steam = 0, t = 0) {
  // inside of the pita, back edge
  c.fillStyle = '#D79D55';
  c.beginPath(); c.moveTo(-88, -106); c.bezierCurveTo(-84, -160, 84, -160, 88, -106); c.closePath(); c.fill();
  frill(c, -74, 74, -142, 19, C.lettuceDark, 0);
  const meats = [[-48, -142, 30, 14, -0.35], [-12, -154, 34, 15, 0.18], [26, -150, 32, 14, -0.12], [58, -134, 24, 12, 0.5], [-32, -126, 30, 13, 0.12], [12, -130, 34, 13, -0.22], [-64, -122, 20, 11, -0.6]];
  for (const [x, y, rx, ry, a] of meats) {
    c.fillStyle = C.meat; c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, TAU); c.fill();
    c.strokeStyle = C.meatDark; c.lineWidth = 3;
    c.beginPath(); c.ellipse(x, y + 2, rx * 0.6, ry * 0.35, a, 0.2, Math.PI - 0.2); c.stroke();
    c.fillStyle = 'rgba(255,190,140,.32)'; c.beginPath(); c.ellipse(x - rx * 0.25, y - ry * 0.4, rx * 0.45, ry * 0.25, a, 0, TAU); c.fill();
  }
  for (const [x, y, r] of [[-40, -158, 17], [44, -162, 16], [6, -172, 14]]) {
    c.fillStyle = C.tomato; dot(c, x, y, r); c.fill();
    c.fillStyle = '#F47B63'; dot(c, x, y, r * 0.66); c.fill();
    c.fillStyle = '#FFD27A';
    for (let k = 0; k < 3; k++) { const a = k * 2.1 + 0.4; c.beginPath(); c.ellipse(x + Math.cos(a) * r * 0.38, y + Math.sin(a) * r * 0.38, 2.6, 1.6, a, 0, TAU); c.fill(); }
  }
  c.strokeStyle = C.onion; c.lineWidth = 4.5;
  for (const [x, y, r] of [[22, -172, 13], [-66, -136, 11], [-14, -168, 10]]) { dot(c, x, y, r); c.stroke(); }
  frill(c, -80, 80, -116, 16, C.lettuce, 1.3);
  c.strokeStyle = C.sauce; c.lineWidth = 8; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(-62, -138); c.quadraticCurveTo(-46, -120, -30, -142); c.quadraticCurveTo(-14, -162, 2, -142);
  c.quadraticCurveTo(18, -122, 32, -146); c.quadraticCurveTo(46, -162, 60, -136); c.stroke();
  c.fillStyle = C.sauce; c.beginPath(); c.ellipse(-28, -112, 6, 10, 0, 0, TAU); c.fill();

  // front of the pita
  const g = c.createLinearGradient(-90, 0, 90, 0);
  g.addColorStop(0, '#C98E45'); g.addColorStop(0.35, '#F3CB86'); g.addColorStop(0.6, '#E9B871'); g.addColorStop(1, '#B97D38');
  c.fillStyle = g; c.fill(KEBAB_BODY);
  c.save(); c.clip(KEBAB_BODY);
  c.strokeStyle = 'rgba(120,62,20,.26)'; c.lineWidth = 9;
  for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(-120 + i * 40, -120); c.lineTo(-20 + i * 40, 40); c.stroke(); }
  c.restore();
  c.strokeStyle = '#F8DCA6'; c.lineWidth = 7;
  c.beginPath(); c.moveTo(-86, -106); c.quadraticCurveTo(0, -72, 86, -106); c.stroke();

  // paper wrap, a touch wider than the pita
  c.save();
  const m = c.getTransform();
  c.translate(0, 20); c.scale(1.07, 1.03); c.translate(0, -20); c.clip(KEBAB_BODY);
  c.setTransform(m);
  c.beginPath(); c.moveTo(-200, -38); c.lineTo(200, 12); c.lineTo(200, 300); c.lineTo(-200, 300); c.closePath(); c.clip();
  c.fillStyle = '#FFFFFF'; c.fillRect(-200, -60, 400, 360);
  const pg = c.createLinearGradient(-96, 0, 96, 0);
  pg.addColorStop(0, 'rgba(15,36,34,.05)'); pg.addColorStop(0.5, 'rgba(15,36,34,0)'); pg.addColorStop(1, 'rgba(15,36,34,.18)');
  c.fillStyle = pg; c.fillRect(-200, -60, 400, 360);
  c.fillStyle = 'rgba(15,36,34,.08)';
  c.beginPath(); c.moveTo(-200, -38); c.lineTo(200, 12); c.lineTo(200, 26); c.lineTo(-200, -24); c.closePath(); c.fill();
  c.save(); c.translate(-4, 74); c.rotate(-0.08);
  rr(c, -46, -18, 92, 36, 9); c.fillStyle = C.teal; c.fill();
  txt(c, 'KEBAB', 0, 8, font(800, 21), '#FFFFFF', 'center', 1);
  c.restore();
  c.restore();

  if (steam > 0) {
    c.lineWidth = 7; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const x0 = -34 + i * 34;
      const sg = c.createLinearGradient(0, -190, 0, -320);
      sg.addColorStop(0, `rgba(255,255,255,${0.6 * steam})`); sg.addColorStop(1, 'rgba(255,255,255,0)');
      c.strokeStyle = sg; c.beginPath();
      for (let s = 0; s <= 1.0001; s += 0.1) {
        const x = x0 + Math.sin(s * 5 + t * 3.2 + i * 1.7) * 10, y = -192 - s * 120;
        s === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
      }
      c.stroke();
    }
  }
}

/* ------------------------------------------------------------------ *
 * Abdul. Head coordinates are relative to the head centre.
 * ------------------------------------------------------------------ */
const FRONT_BRAIDS = [
  [[-50, -36], [-74, -10], [-80, 70], [-84, 150]],
  [[-58, -22], [-82, 10], [-92, 90], [-100, 162]],
  [[-64, -6], [-88, 30], [-104, 100], [-116, 150]],
  [[-62, 12], [-80, 50], [-92, 112], [-96, 176]]
];
const BACK_BRAIDS = [[-44, 166], [-22, 180], [0, 186], [22, 180], [44, 166], [-62, 150], [62, 150]];

function braid(c, pts4, w, sw, cuff) {
  const [a, b, d, e] = pts4.map(p => ({ x: p[0], y: p[1] }));
  const d2 = { x: d.x + sw * 0.5, y: d.y }, e2 = { x: e.x + sw, y: e.y };
  const N = 16, pts = [];
  for (let i = 0; i <= N; i++) pts.push(bez(a, b, d2, e2, i / N));
  c.strokeStyle = C.hair; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); pts.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.stroke();
  c.strokeStyle = C.hairHi; c.lineWidth = 1.7;
  for (let i = 1; i < N; i++) {
    const p = pts[i], q = pts[i + 1], ang = Math.atan2(q.y - p.y, q.x - p.x);
    c.save(); c.translate(p.x, p.y); c.rotate(ang + (i % 2 ? 0.6 : -0.6));
    c.beginPath(); c.ellipse(0, 0, w * 0.5, w * 0.3, 0, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.restore();
  }
  if (cuff) {
    const p = pts[N - 1], q = pts[N], ang = Math.atan2(q.y - p.y, q.x - p.x);
    c.save(); c.translate(p.x, p.y); c.rotate(ang);
    rr(c, -4, -w * 0.62, 9, w * 1.24, 2); c.fillStyle = C.gold; c.fill();
    c.restore();
  }
}

function drawBackHair(c, t) {
  const sw = Math.sin(t * 2.3) * 4;
  for (let i = 0; i < BACK_BRAIDS.length; i++) {
    const [ex, ey] = BACK_BRAIDS[i];
    braid(c, [[ex * 0.5, -40], [ex * 0.9, 20], [ex * 1.05, 100], [ex, ey]], 13, sw * (i % 2 ? 1 : -0.6), false);
  }
}

function drawHead(c, t, o = {}) {
  const blink = o.blink ?? 1, talk = o.talk ?? 0;
  const sw = Math.sin(t * 2.3) * 5 + (o.extraSway || 0);
  // ears, head
  c.fillStyle = C.skinShade;
  c.beginPath(); c.ellipse(-57, 6, 10, 16, 0, 0, TAU); c.fill();
  c.beginPath(); c.ellipse(57, 6, 10, 16, 0, 0, TAU); c.fill();
  const hg = c.createRadialGradient(-14, -14, 10, 0, 0, 90);
  hg.addColorStop(0, C.skinLight); hg.addColorStop(1, C.skin);
  c.fillStyle = hg; c.beginPath(); c.ellipse(0, 0, 58, 74, 0, 0, TAU); c.fill();
  // beard and moustache
  c.fillStyle = 'rgba(27,19,17,.88)';
  c.beginPath(); c.ellipse(0, 4, 59, 76, 0, 0.06 * Math.PI, 0.94 * Math.PI); c.ellipse(0, -4, 46, 70, 0, 0.9 * Math.PI, 0.1 * Math.PI, true); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(-25, 37); c.quadraticCurveTo(0, 26, 25, 37); c.quadraticCurveTo(0, 33, -25, 37); c.fill();
  // mouth
  const mh = 20 + talk * 6;
  c.save();
  c.beginPath(); c.moveTo(-23, 41); c.quadraticCurveTo(0, 43, 23, 41); c.quadraticCurveTo(15, 41 + mh, 0, 42 + mh); c.quadraticCurveTo(-15, 41 + mh, -23, 41); c.closePath();
  c.fillStyle = '#3A1A12'; c.fill(); c.clip();
  c.fillStyle = '#FFFFFF'; c.fillRect(-24, 38, 48, 9);
  c.fillStyle = '#C2564A'; c.beginPath(); c.ellipse(0, 44 + mh, 12, 7, 0, 0, TAU); c.fill();
  c.restore();
  // nose
  c.strokeStyle = C.skinShade; c.lineWidth = 3.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-11, 20); c.quadraticCurveTo(0, 28, 11, 20); c.stroke();
  c.fillStyle = 'rgba(110,67,42,.35)'; c.beginPath(); c.ellipse(0, 10, 7, 14, 0, 0, TAU); c.fill();
  // eyes
  for (const s of [-1, 1]) {
    c.fillStyle = '#1A0F0B'; c.beginPath(); c.ellipse(s * 24, -6, 6.5, 8.5 * blink, 0, 0, TAU); c.fill();
    if (blink > 0.5) { c.fillStyle = '#FFFFFF'; dot(c, s * 24 + 2, -9, 2.2); c.fill(); }
    c.strokeStyle = C.hair; c.lineWidth = 6;
    c.beginPath(); c.moveTo(s * 38, -22); c.quadraticCurveTo(s * 26, -31, s * 12, -24); c.stroke();
  }
  // hair: box-parted cap
  c.save();
  c.beginPath(); c.moveTo(-72, 26); c.lineTo(-62, -8); c.quadraticCurveTo(-48, -40, -20, -44); c.quadraticCurveTo(0, -50, 20, -44);
  c.quadraticCurveTo(48, -40, 62, -8); c.lineTo(72, 26); c.lineTo(80, -130); c.lineTo(-80, -130); c.closePath(); c.clip();
  c.fillStyle = C.hair; c.beginPath(); c.ellipse(0, -6, 65, 82, 0, 0, TAU); c.fill(); c.clip();
  c.strokeStyle = 'rgba(150,104,76,.28)'; c.lineWidth = 1.4;
  for (const y of [-70, -54]) { c.beginPath(); c.ellipse(0, y + 60, 62, 58, 0, Math.PI * 1.12, Math.PI * 1.88); c.stroke(); }
  for (const x of [-34, -12, 12, 34]) { c.beginPath(); c.moveTo(x * 0.8, -80); c.lineTo(x, -46); c.stroke(); }
  c.restore();
  // front braids, both sides
  for (const side of [-1, 1]) {
    FRONT_BRAIDS.forEach((b, i) => {
      braid(c, b.map(p => [p[0] * side, p[1]]), 12.5, sw * (1 + i * 0.15), i % 2 === 1);
    });
  }
}

const AB = { x: 960, y: 882, s: 0.92 };
const abW = p => ({ x: AB.x + p.x * AB.s, y: AB.y + p.y * AB.s });

function waveArm(t) {
  const we = E.inOut(prog(t, T.wave[0], T.wave[0] + 0.3)) * (1 - E.inOut(prog(t, T.wave[1], T.wave[1] + 0.45)));
  const wav = Math.sin((t - T.wave[0]) * 9) * 0.32 * we;
  const elbow = { x: lerp(136, 186, we), y: lerp(-418, -458, we) };
  const fa = lerp(Math.PI / 2 - 0.12, -Math.PI / 2 + 0.36, we) + wav;
  return { we, elbow, fa, hand: { x: elbow.x + Math.cos(fa) * 128, y: elbow.y + Math.sin(fa) * 128 } };
}

function openHand(c, p, ang, open) {

/* the arm that holds the kebab, in world space so it can reach the lens */
const REACH = { x: 920, y: 1010, k: 2.05, r: -0.1 };
function kebabArmState(t, cam) {
  const rest = abW({ x: -58, y: -404 });
  const e = E.inOut(prog(t, T.reach[0], T.reach[1]));
  const inv = cam.m.inverse();
  const tgt = inv.transformPoint(new DOMPoint(REACH.x, REACH.y));
  return {
    e,
    hand: { x: lerp(rest.x, tgt.x, e), y: lerp(rest.y, tgt.y, e) - Math.sin(e * Math.PI) * 24 },
    k: lerp(0.4 * AB.s, REACH.k / cam.z, e),
    r: lerp(-0.1, REACH.r, e)
  };
}
function kebabCenter(st) {
  // the fist grips the wrap at kebab-local (0, 75)
  return { x: st.hand.x + Math.sin(st.r) * 75 * st.k, y: st.hand.y - Math.cos(st.r) * 75 * st.k };
}
function drawKebabArm(c, t, cam, drawKebabToo = true) {
  const st = kebabArmState(t, cam);
  const elbow = abW({ x: -142, y: -420 });
  const cs = Math.cos(st.r), sn = Math.sin(st.r);
  const toW = (lx, ly) => ({ x: st.hand.x + (lx * cs - ly * sn) * st.k, y: st.hand.y + (lx * sn + ly * cs) * st.k });
  const wrist = toW(-80, 14);
  const we = Math.max(42, 118 * st.k), ee = 50;
  const dx = wrist.x - elbow.x, dy = wrist.y - elbow.y, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  const cuffAt = 0.8;
  const cuff = { x: elbow.x + dx * cuffAt, y: elbow.y + dy * cuffAt };
  const wc = lerp(ee, we, cuffAt);
  c.fillStyle = C.teal;
  c.beginPath();
  c.moveTo(elbow.x + nx * ee / 2, elbow.y + ny * ee / 2); c.lineTo(cuff.x + nx * wc / 2, cuff.y + ny * wc / 2);
  c.lineTo(cuff.x - nx * wc / 2, cuff.y - ny * wc / 2); c.lineTo(elbow.x - nx * ee / 2, elbow.y - ny * ee / 2); c.closePath(); c.fill();
  dot(c, elbow.x, elbow.y, ee / 2); c.fill();
  c.strokeStyle = C.tealDark; c.lineWidth = wc * 0.28; c.lineCap = 'butt';
  c.beginPath(); c.moveTo(cuff.x + nx * wc / 2, cuff.y + ny * wc / 2); c.lineTo(cuff.x - nx * wc / 2, cuff.y - ny * wc / 2); c.stroke();
  c.lineCap = 'round';
  // back of the hand, then kebab, then the fingers wrapped around it
  c.save(); c.translate(st.hand.x, st.hand.y); c.rotate(st.r); c.scale(st.k, st.k);
  c.fillStyle = C.skinShade; rr(c, -104, -6, 70, 92, 30); c.fill();
  c.restore();
  if (drawKebabToo) {
    const kc = kebabCenter(st);
    c.save(); c.translate(kc.x, kc.y); c.rotate(st.r); c.scale(st.k, st.k);
    drawKebab(c, prog(t, 8.6, 9.2), t);
    c.restore();
  }
  c.save(); c.translate(st.hand.x, st.hand.y); c.rotate(st.r); c.scale(st.k, st.k);
  c.fillStyle = C.skin;
  for (let i = 0; i < 4; i++) { rr(c, -70, -36 + i * 23, 84 - i * 6, 24, 12); c.fill(); }
  c.strokeStyle = 'rgba(70,40,24,.45)'; c.lineWidth = 2.5;
  for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-60, -36 + i * 23); c.lineTo(0 - i * 6, -36 + i * 23); c.stroke(); }
  c.fillStyle = C.skinLight; c.save(); c.translate(-4, -42); c.rotate(-0.9); rr(c, -11, -26, 22, 50, 11); c.fill(); c.restore();
  c.restore();
  return st;
}

  const y = lerp(1560, 548, E.outBack(a, 0.9)) + Math.sin(t * 1.7) * 5 * prog(t, 0.9, 1.5);
  const rot = lerp(0.2, -0.045, E.out(prog(t, 0, 1.15)));
  return { x: 1300, y, rot, s: 1 };
}
function phoneMatrix(p) { return new DOMMatrix().translate(p.x, p.y).rotate(p.rot * 180 / Math.PI).scale(p.s); }

function along(pts, u) {
  const L = []; let tot = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); L.push(l); tot += l; }
  let d = u * tot;
  for (let i = 0; i < L.length; i++) {
    if (d <= L[i] || i === L.length - 1) { const f = clamp(d / L[i]); return { x: lerp(pts[i][0], pts[i + 1][0], f), y: lerp(pts[i][1], pts[i + 1][1], f), i, f }; }
    d -= L[i];
  }
}

function lineReveal(c, t, tin, tout, x, y, size, segs, opt = {}) {
  const a = E.outQuint(prog(t, tin, tin + 0.55));
  const o = tout == null ? 0 : E.in(prog(t, tout, tout + 0.28));
  if (a <= 0 || o >= 1) return;
  c.save();
  c.beginPath(); c.rect(x - 30, y - size * 1.0, 1500, size * 1.32); c.clip();
  c.translate(0, (1 - a) * size * 1.15 - o * size * 1.15);
  c.font = font(opt.weight || 800, size, opt.fam || DISPLAY);
  c.letterSpacing = (opt.ls || 0) + 'px';
  let cx = x;
  for (const s of segs) {
    const w = c.measureText(s.t).width;
    if (s.hl) {
      const hp = E.outQuint(prog(t, tin + 0.3, tin + 0.75));
      rr(c, cx - size * 0.1, y - size * 0.8, (w + size * 0.2) * hp, size * 1.0, size * 0.16); c.fillStyle = s.hl; c.fill();
    }
    c.fillStyle = s.c || opt.color || C.ink; c.textAlign = 'left'; c.fillText(s.t, cx, y);
    cx += w;
  }
  c.letterSpacing = '0px';
  c.restore();
}

function drawDoorLeaf(c, t) {
  const th = 1.75 * E.inOut(prog(t, T.door[0], T.door[1]));

    quad(c, [P(DOOR.w, top), P(DOOR.w, bot), P(DOOR.w, bot, 34), P(DOOR.w, top, 34)]); c.fillStyle = C.doorDeep; c.fill();
  }
  quad(c, [P(0, top), P(DOOR.w, top), P(DOOR.w, bot), P(0, bot)]);
  const a = P(0, 540), b = P(DOOR.w, 540);
  const dg = c.createLinearGradient(a.x, a.y, b.x, b.y);
  dg.addColorStop(0, '#5E3A23'); dg.addColorStop(0.5, C.door); dg.addColorStop(1, '#774A2E');
  c.fillStyle = dg; c.fill();
  for (const [y0, y1] of [[230, 520], [580, 850]]) {

  }
  // brass hardware
  const hA = 0.6 * E.inOut(prog(t, T.handle[0], T.handle[1])) * (1 - E.inOut(prog(t, 6.5, 6.8)));
  const pv = P(352, 548);

  const le = P(352 - 62 * Math.cos(hA), 548 + 62 * Math.sin(hA));
  c.strokeStyle = '#E8C063'; c.lineCap = 'round'; c.lineWidth = 13 * Math.max(0.35, Math.cos(th) * 0.7 + 0.3); seg(c, pv, le);

}

function drawBubble(c, t) {
  const a = prog(t, T.bubble[0], T.bubble[0] + 0.32), o = prog(t, T.bubble[1] - 0.25, T.bubble[1]);
  if (a <= 0 || o >= 1) return;
  const s = E.outBack(a, 1.8);
  c.save(); c.globalAlpha = 1 - o; c.translate(1100, 300); c.scale(s, s);
  c.save(); c.shadowColor = 'rgba(0,0,0,.22)'; c.shadowBlur = 30; c.shadowOffsetY = 10;
  c.fillStyle = '#FFFFFF';
  rr(c, 50, -232, 560, 216, 44); c.fill();
  c.beginPath(); c.moveTo(0, 0); c.lineTo(120, -60); c.lineTo(84, -26); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(60, -30, 96, -64); c.lineTo(150, -40); c.quadraticCurveTo(90, -10, 0, 0); c.fill();
  c.restore();
  txt(c, 'Ciao! Ecco il', 92, -138, font(800, 66), C.ink);
  txt(c, 'tuo ', 92, -60, font(800, 66), C.ink);
  c.font = font(800, 66); const w = c.measureText('tuo ').width;
  txt(c, 'kebab.', 92 + w, -60, font(800, 66), C.tealDark);
  c.restore();
}

function drawScene2(c, t, cam) {
  c.save(); c.setTransform(c.getTransform().multiply(cam.m));
  drawRoom(c, t);
  const reach = t >= T.reach[0];
  // what is behind the door
  c.save(); c.beginPath(); c.rect(DOOR.x, DOOR.y, DOOR.w, FLOOR_Y - DOOR.y); c.clip();
  drawLanding(c, t);
  if (t > T.door[0]) {
    c.save(); c.translate(AB.x, AB.y); c.scale(AB.s, AB.s); drawAbdul(c, t); c.restore();
    if (!reach) drawKebabArm(c, t, cam);
  }
  c.restore();
  drawDoorFrame(c);
  // warm light spilling into the room
  const open = E.inOut(prog(t, T.door[0], T.door[1]));
  if (open > 0) {
    const sg = c.createLinearGradient(0, FLOOR_Y, 0, H + 60);
    sg.addColorStop(0, `rgba(255,214,140,${0.42 * open})`); sg.addColorStop(1, 'rgba(255,214,140,0)');
    c.fillStyle = sg; quad(c, [{ x: DOOR.x, y: FLOOR_Y }, { x: DOOR.x + DOOR.w, y: FLOOR_Y }, { x: 1420, y: H + 60 }, { x: 560, y: H + 60 }]); c.fill();
  }
  drawDoorLeaf(c, t);
  // light under the closed door, and two feet waiting outside
  const gap = prog(t, T.reveal[0] + 0.2, T.reveal[0] + 0.5) * (1 - prog(t, T.door[0], T.door[0] + 0.2));
  if (gap > 0) {
    c.fillStyle = `rgba(255,214,140,${0.9 * gap})`; c.fillRect(DOOR.x + 6, FLOOR_Y - 1, DOOR.w - 12, 5);
    const feet = prog(t, T.feet, T.feet + 0.3);
    c.fillStyle = `rgba(40,24,14,${0.85 * gap * feet})`; c.fillRect(904, FLOOR_Y - 1, 38, 5); c.fillRect(980, FLOOR_Y - 1, 38, 5);
  }
  if (reach && t < T.wipe[0]) drawKebabArm(c, t, cam);
  else if (reach) drawKebabArm(c, t, cam, false);
  drawDinDon(c, t);
  c.restore();
  // vignette
  const vg = c.createRadialGradient(960, 540, 300, 960, 540, 1150);
  vg.addColorStop(0, 'rgba(10,20,18,0)'); vg.addColorStop(1, 'rgba(10,20,18,.42)');
  c.fillStyle = vg; c.fillRect(0, 0, W, H);
  drawBubble(c, t);
}

/* ------------------------------------------------------------------ *
 * End card.
 * ------------------------------------------------------------------ */
const HERO = { x: 1410, y: 566, k: 2.15, r: -0.2 };

function heroState(t) {
  const cam = cam2(T.wipe[0]);
  const st = kebabArmState(T.wipe[0], cam);
  const kc = cam.m.transformPoint(new DOMPoint(kebabCenter(st).x, kebabCenter(st).y));
  const p = prog(t, T.hero[0], T.hero[1]);
  const settle = 1 - prog(t, 11.6, T.settle);
  return {
    x: lerp(kc.x, HERO.x, E.inOut(p)),
    y: lerp(kc.y, HERO.y, E.inOut(p)) + Math.sin((t - 11) * 2.4) * 8 * settle * prog(t, 11, 11.6),
    k: lerp(st.k * cam.z, HERO.k, E.inOut(p)) + 0.08 * Math.sin(Math.PI * prog(t, T.hero[1] - 0.25, T.hero[1] + 0.35)),
    r: lerp(st.r, HERO.r, E.inOut(p)) + Math.sin((t - 11) * 2) * 0.02 * settle * prog(t, 11, 11.6)
  };
}

function endBg(c) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#05D3C3'); g.addColorStop(1, '#00BAAC');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const rg = c.createRadialGradient(HERO.x, HERO.y, 40, HERO.x, HERO.y, 560);
  rg.addColorStop(0, 'rgba(255,255,255,.30)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = rg; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 3;
  dot(c, HERO.x, HERO.y, 330); c.stroke(); dot(c, HERO.x, HERO.y, 430); c.stroke();
}

function bits(c, t) {
  const p = prog(t, 10.85, 11.5), settle = 1 - prog(t, 11.5, T.settle);
  if (p <= 0) return;
  const items = [
    ['leaf', 1080, 300, -0.5, 1.0], ['tomato', 1730, 330, 0.3, 1.0], ['onion', 1740, 810, 0, 1.0],
    ['leaf', 1150, 850, 2.4, 0.8], ['tomato', 1130, 600, 0, 0.62]
  ];
  for (const [kind, x, y, r, s] of items) {
    const e = E.outBack(p, 1.6);
    const px = lerp(HERO.x, x, e), py = lerp(HERO.y, y, e) + Math.sin(t * 2 + x) * 6 * settle;
    c.save(); c.translate(px, py); c.rotate(r + Math.sin(t * 1.5 + y) * 0.08 * settle); c.scale(s * e, s * e);
    if (kind === 'leaf') {
      c.fillStyle = C.lettuce; c.beginPath();
      for (let i = 0; i <= 24; i++) { const a = i / 24 * TAU, rad = 62 + Math.sin(a * 7) * 7; c.lineTo(Math.cos(a) * rad * 1.3, Math.sin(a) * rad * 0.75); }
      c.fill(); c.strokeStyle = C.lettuceDark; c.lineWidth = 5; seg(c, { x: -70, y: 0 }, { x: 70, y: 0 });
    } else if (kind === 'tomato') {
      c.fillStyle = C.tomato; dot(c, 0, 0, 52); c.fill(); c.fillStyle = '#F47B63'; dot(c, 0, 0, 36); c.fill();
      c.fillStyle = '#FFD27A'; for (let k = 0; k < 5; k++) { const a = k * TAU / 5; c.beginPath(); c.ellipse(Math.cos(a) * 20, Math.sin(a) * 20, 6, 4, a, 0, TAU); c.fill(); }
    } else {
      c.strokeStyle = C.onion; c.lineWidth = 12; dot(c, 0, 0, 44); c.stroke();
      c.strokeStyle = '#C887BC'; c.lineWidth = 4; dot(c, 0, 0, 30); c.stroke();
    }
    c.restore();
  }
}

function drawEndText(c, t) {
  const t0 = T.endText;
  lineReveal(c, t, t0, null, 150, 300, 28, [{ t: 'CONSEGNATO · 21:59' }], { fam: BODY, weight: 700, ls: 5, color: 'rgba(15,36,34,.72)' });
  lineReveal(c, t, t0 + 0.1, null, 150, 438, 118, [{ t: 'Il kebab bussa' }]);
  lineReveal(c, t, t0 + 0.22, null, 150, 562, 118, [{ t: 'alla tua ' }, { t: 'porta.', hl: '#FFFFFF' }]);
  lineReveal(c, t, t0 + 0.45, null, 150, 650, 38, [{ t: 'Caldo caldo, in 12 minuti.' }], { fam: BODY, weight: 600 });
  lineReveal(c, t, t0 + 0.53, null, 150, 700, 38, [{ t: 'Te lo porta Abdul.' }], { fam: BODY, weight: 600 });
  const a = E.outBack(prog(t, t0 + 0.75, t0 + 1.2), 1.5);
  if (a > 0) {
    c.save(); c.translate(150, 868); c.globalAlpha = clamp(a);
    c.font = font(800, 84); const ww = c.measureText('deliveroo').width;
    c.save(); c.translate(0, (1 - a) * 30);
    txt(c, 'deliveroo', 0, 0, font(800, 84), '#FFFFFF', 'left', -1);
    c.restore();
    const bx = ww + 44, bs = clamp(a, 0, 1.2);
    c.save(); c.translate(bx + 130, -28); c.scale(bs, bs);
    rr(c, -130, -40, 260, 80, 40); c.fillStyle = C.ink; c.fill();
    txt(c, 'Ordina ora', 0, 11, font(700, 32, BODY), '#FFFFFF', 'center');
    c.restore();
    c.restore();
  }
}

function drawEnd(c, t) {
  endBg(c);
  bits(c, t);
}

/* ------------------------------------------------------------------ *
 * Compositor.
 * ------------------------------------------------------------------ */
function render(t) {
  const c = ctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  let pinScreen = { x: 960, y: 540 };
  if (t < T.reveal[1]) pinScreen = drawScene1(c, t);
  if (t >= T.reveal[0] && t < T.wipe[1]) {
    const cam = cam2(t);
    const rp = E.inOut(prog(t, T.reveal[0], T.reveal[1]));
    c.save();
    if (rp < 1) { dot(c, pinScreen.x, pinScreen.y, 4 + rp * 1300); c.clip(); }
    drawScene2(c, t, cam);
    c.restore();
    if (rp > 0 && rp < 1) { // white rim on the reveal
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 10 * (1 - rp) + 2; dot(c, pinScreen.x, pinScreen.y, 4 + rp * 1300); c.stroke();
    }
  }
  if (t >= T.wipe[0]) {
    const hs = heroState(t);
    const wp = E.inOut(prog(t, T.wipe[0], T.wipe[1]));
    c.save();
    if (wp < 1) { dot(c, hs.x, hs.y, 10 + wp * 2300); c.clip(); }
    drawEnd(c, t);
    c.restore();
    c.save(); c.translate(hs.x + 30, hs.y + 40); c.rotate(hs.r); c.scale(hs.k, hs.k);
    c.filter = 'blur(18px)'; c.fillStyle = 'rgba(0,70,64,.28)'; c.fill(KEBAB_BODY); c.filter = 'none';
    c.restore();
    c.save(); c.translate(hs.x, hs.y); c.rotate(hs.r); c.scale(hs.k, hs.k);
    drawKebab(c, 1 - prog(t, 12.3, T.settle), t);
    c.restore();
    drawEndText(c, t);
  }
}

/* ------------------------------------------------------------------ *
 * Player, exporter hooks and controls.
 * ------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
const clean = params.has('clean') || location.hash === '#clean';
if (clean) document.body.classList.add('clean');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let cur = 0, playing = false, last = null, ended = false;
const ui = {
  play: document.getElementById('play'), icon: document.getElementById('playIcon'),
  restart: document.getElementById('restart'), scrub: document.getElementById('scrub'),
  time: document.getElementById('time'), exp: document.getElementById('export'), status: document.getElementById('status')
};
const fmt = s => s.toFixed(2).replace('.', ',');
function syncUI() {
  ui.scrub.value = cur.toFixed(2);
  ui.time.textContent = `${fmt(cur)} / ${fmt(DUR)} s`;
  ui.icon.setAttribute('d', playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z');
  ui.play.setAttribute('aria-label', playing ? 'Pausa' : 'Riproduci');
}
function draw() { render(cur); syncUI(); }
function finish() {
  playing = false; ended = true; cur = DUR; draw();
  window.dispatchEvent(new CustomEvent('animationcomplete', { detail: { duration: DUR } }));
  try { parent.postMessage({ type: 'animation:complete', duration: DUR }, '*'); } catch (e) { /* no parent */ }
}
function tick(now) {
  if (playing) {
    if (last != null) cur += (now - last) / 1000;
    last = now;
    if (cur >= DUR) finish(); else draw();
  }
  requestAnimationFrame(tick);
}
function play() { if (cur >= DUR) cur = 0; ended = false; playing = true; last = null; syncUI(); }
function pause() { playing = false; syncUI(); }
function seek(t) { cur = clamp(+t || 0, 0, DUR); playing = false; ended = cur >= DUR; draw(); return cur; }

const fontsReady = Promise.race([
  Promise.all([
    document.fonts.load(font(800, 100)), document.fonts.load(font(700, 20, BODY)),
    document.fonts.load(font(600, 20, BODY)), document.fonts.load(font(500, 20, BODY))
  ]),
  new Promise(r => setTimeout(r, 2500))
]).then(() => document.fonts.ready);

/* Exporters can drive the spot frame by frame through this object,
   or with postMessage({type:'seek', time}) / 'play' / 'pause'. */
window.ANIMATION = {
  duration: DUR, fps: FPS, width: W, height: H, aspectRatio: '16:9',
  ready: fontsReady,
  seek, renderFrame: seek, play, pause,
  restart() { seek(0); play(); },
  get currentTime() { return cur; },
  get playing() { return playing; },
  get ended() { return ended; },
  canvas: cv
};
window.__ANIMATION__ = window.ANIMATION;
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'seek') seek(d.time);
  else if (d.type === 'play') play();
  else if (d.type === 'pause') pause();
  else if (d.type === 'getInfo') { try { e.source.postMessage({ type: 'animation:info', duration: DUR, fps: FPS, width: W, height: H }, '*'); } catch (err) { /* ignore */ } }
});

ui.play.addEventListener('click', () => (playing ? pause() : play()));
ui.restart.addEventListener('click', () => { seek(0); play(); });
ui.scrub.addEventListener('input', () => seek(parseFloat(ui.scrub.value)));
document.addEventListener('keydown', e => {
  if (e.target === ui.scrub) return;
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.code === 'ArrowRight') seek(cur + 1 / FPS * 6);
  else if (e.code === 'ArrowLeft') seek(cur - 1 / FPS * 6);
  else if (e.code === 'Home') seek(0);
});

/* Real-time recording of the canvas (WebM, or MP4 where the browser can) */
ui.exp.addEventListener('click', async () => {
  if (!('MediaRecorder' in window) || !cv.captureStream) { ui.status.textContent = 'Questo browser non registra video dal canvas. Usa Chrome, Edge o Firefox.'; return; }
  const types = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const rec = new MediaRecorder(cv.captureStream(FPS), mime ? { mimeType: mime, videoBitsPerSecond: 16e6 } : undefined);
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `spot-kebab-in-arrivo.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    ui.status.textContent = `Video pronto: spot-kebab-in-arrivo.${ext} (${(blob.size / 1e6).toFixed(1).replace('.', ',')} MB).`;
    ui.exp.disabled = false;
  };
  ui.exp.disabled = true;
  ui.status.textContent = 'Registrazione in corso, lascia la scheda in primo piano…';
  seek(0); draw();
  rec.start(250);
  const done = () => { window.removeEventListener('animationcomplete', done); setTimeout(() => rec.stop(), 300); };
  window.addEventListener('animationcomplete', done);
  play();
});

const startAt = params.has('t') ? parseFloat(params.get('t')) : null;
fontsReady.then(() => {
  if (startAt != null && !Number.isNaN(startAt)) seek(startAt);
  else if (reduce || params.get('autoplay') === '0') seek(DUR);
  else { seek(0); play(); }
  requestAnimationFrame(tick);
});
draw();
