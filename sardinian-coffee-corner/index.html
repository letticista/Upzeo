<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Sardinian Coffee Corner Espresso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single 9:16 film frame centred on an espresso-dark ground; the player controls float over its lower edge and hide while it plays. */
:root{
  --ground:#0e0a08;
  --frame:#18110d;
  --cream:#f2eadb;
  --brass:#c9a15a;
  --muted:#b9ab97;
  --ink:#1a120c;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;background:var(--ground);color:var(--cream);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{height:100%;display:flex;align-items:center;justify-content:center;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#frame{position:relative;width:360px;height:640px;max-width:100%;border-radius:12px;overflow:hidden;background:var(--frame);box-shadow:0 24px 70px rgba(0,0,0,.55);container-type:inline-size;-webkit-tap-highlight-color:transparent}
#stage{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:34px 12px 12px;background:linear-gradient(to top,rgba(12,8,6,.88),rgba(12,8,6,0));transition:opacity .35s ease}
#frame.idle #hud{opacity:0;pointer-events:none}
.btn{appearance:none;border:1px solid rgba(242,234,219,.28);background:rgba(242,234,219,.08);color:var(--cream);border-radius:999px;height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:700 11px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:rgba(242,234,219,.16)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:14px;height:14px;fill:currentColor;flex:none}
#playBtn{padding:0;width:36px}
#exportBtn{background:var(--brass);border-color:transparent;color:var(--ink)}
#exportBtn:hover{background:#d8b373}
.btn:focus-visible,#scrub:focus-visible,#bigplay:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#time{font:500 11px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#scrub{flex:1;min-width:0;accent-color:var(--brass);height:20px;margin:0}
#bigplay{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:1px solid rgba(242,234,219,.35);background:rgba(18,12,9,.6);color:var(--cream);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
#bigplay svg{width:30px;height:30px;fill:currentColor;margin-left:4px}
#rec{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:rgba(12,8,6,.78);font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--cream)}
#rec .dot{width:8px;height:8px;border-radius:50%;background:#e0453a;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
#toast{position:absolute;left:12px;right:12px;bottom:68px;padding:10px 12px;border-radius:10px;background:rgba(12,8,6,.9);border:1px solid rgba(201,161,90,.35);font:500 12px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--cream);opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .25s ease;pointer-events:none}
#toast.show{opacity:1;transform:none}
@container (max-width:330px){#time{display:none}}
@media (prefers-reduced-motion:reduce){#hud,#toast{transition:none}#rec .dot{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="frame" class="idle">
    <canvas id="stage" width="1080" height="1920" role="img" aria-label="Animazione di 30 secondi: scelta dei chicchi, macinatura con la Ceado E6C, pressatura nel portafiltro, aggancio alla Profitec GO, estrazione dell'espresso, cucchiaino senza zucchero, il primo sorso e il logo Sardinian Coffee Corner."></canvas>
    <button id="bigplay" type="button" aria-label="Riproduci" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <div id="rec" hidden><span class="dot"></span><span id="recText">REC 0:00</span></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="hud">
      <button id="playBtn" class="btn" type="button" aria-label="Pausa"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
      <span id="time">0:00 / 0:30</span>
      <input id="scrub" type="range" min="0" max="30000" step="10" value="0" aria-label="Posizione nell'animazione">
      <button id="exportBtn" class="btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4h2v9.2l3.3-3.3 1.4 1.4L12 17l-5.7-5.7 1.4-1.4 3.3 3.3zM5 19h14v2H5z"/></svg><span id="exportLabel">Esporta video</span></button>
    </div>
  </div>
</div>

frame.addEventListener('focusin', poke);
cv.addEventListener('click', () => { if (recording) return; if (!frame.classList.contains('idle')) { playing ? pause() : play(); } });
playBtn.addEventListener('click', () => { playing ? pause() : play(); });
bigplay.addEventListener('click', play);
scrub.addEventListener('input', () => { scrubbing = true; seek(Number(scrub.value) / 1000); timeEl.textContent = fmt(T) + ' / ' + fmt(DUR); poke(); });
scrub.addEventListener('change', () => { scrubbing = false; if (playing) lastTs = null; });
document.addEventListener('keydown', e => {
  if (recording || e.target === scrub) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight') { seek(T + 1); poke(); }
  else if (e.key === 'ArrowLeft') { seek(T - 1); poke(); }
  else if (e.key === 'r') { seek(0); play(); }
});

/* toast */
let toastTimer = 0;
function toast(msg, ms = 4200) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms); }

/* video export: real-time capture of the canvas, then a save offered through the viewer */
function pickMime() {
  if (!window.MediaRecorder) return null;
  const list = ['video/mp4;codecs=avc1.640033', 'video/mp4;codecs=avc1.4d0033', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) { } }
  return null;
}
async function getDownloads() {
  if (!window.claude || typeof window.claude.use !== 'function') return 'standalone';
  try { return await window.claude.use('downloads'); } catch (e) { return null; }
}
async function saveFile(blob, name) {
  const dl = await getDownloads();
  if (dl === 'standalone') {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000); return 'saved';
  }
  if (!dl) throw { code: 'unavailable' };
  const res = await dl.save({ filename: name, data: blob });
  return res && res.status;
}
async function offerSave() {
  if (!lastBlob) return;
  exportBtn.disabled = true;
  try {
    const st = await saveFile(lastBlob, lastName);
    if (st !== 'delivered') toast('Video salvato: ' + lastName + ' (1080×1920).');
    exportLabel.textContent = 'Esporta video'; lastBlob = null;
  } catch (e) {
    const code = e && e.code;
    exportLabel.textContent = 'Salva video';
    if (code === 'declined') toast('Salvataggio annullato. Premi “Salva video” per scaricarlo.');
    else if (code === 'rate_limited') toast('C’è già una richiesta di salvataggio aperta. Riprova tra un momento.');
    else if (code === 'too_large') toast('Il file è troppo grande per questa destinazione.');
    else if (code === 'rejected_extension' || code === 'extension_not_enabled') { toast('Questo formato video non è disponibile qui.'); lastBlob = null; exportLabel.textContent = 'Esporta video'; }
    else { toast('Il salvataggio dei file non è disponibile in questa vista. Apri l’artifact su claude.ai e riprova.'); }
  } finally { exportBtn.disabled = false; }
}
async function exportVideo() {
  if (recording) return;
  if (lastBlob) return offerSave();
  const mime = pickMime();
  if (!mime || !cv.captureStream) { toast('Questo browser non può registrare il video. Prova con Chrome, Edge o Safari aggiornati.'); return; }
  let rec, stream;
  try { stream = cv.captureStream(60); rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14000000 }); }
  catch (e) { toast('Registrazione non disponibile in questo browser.'); return; }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(res => { rec.onstop = res; });
  recording = true; exportBtn.disabled = true; exportLabel.textContent = 'Registrazione…';
  frame.classList.add('idle'); recEl.hidden = false; toastEl.classList.remove('show');
  seek(0); render(0); playing = false;
  rec.start(500);
  const tick = setInterval(() => { recText.textContent = 'REC ' + fmt(T) + ' / ' + fmt(DUR); }, 200);
  await new Promise(res => { onEnd = res; play(); });
  await new Promise(res => setTimeout(res, 700));
  rec.stop(); await stopped; clearInterval(tick);
  stream.getTracks().forEach(tr => tr.stop());
  recording = false; recEl.hidden = true; exportBtn.disabled = false;
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, { type: mime.split(';')[0] });
  exportLabel.textContent = 'Esporta video'; poke();
  if (!blob.size) { toast('La registrazione è vuota. Tieni la scheda in primo piano e riprova.'); return; }
  lastBlob = blob; lastName = 'sardinian-coffee-corner-espresso.' + ext;
  await offerSave();
}
exportBtn.addEventListener('click', exportVideo);
document.addEventListener('visibilitychange', () => { if (document.hidden && recording) toast('Tieni questa scheda in primo piano durante la registrazione.'); });

/* deterministic hooks for frame-by-frame capture */
window.__espresso = { duration: DUR, seek: v => { seek(v); render(T); }, play, pause, get time() { return T; } };

/* ---------------------------------------------------------------- boot */
function build() {
  TX.beans = []; for (let i = 0; i < 10; i++) TX.beans.push(makeBeanSprite(100 + i, i % 3 !== 2));
  TX.wood = makeWood(W, H, 3);
  TX.woodH = makeWoodH(1480, 260, 8);
  TX.bowl = makeBowl(TX.beans);
  TX.grounds = makeGrounds(); TX.groundsPat = ctx.createPattern(TX.grounds, 'repeat');
  TX.crema = makeCrema();
  TX.noise = makeNoise(); TX.noisePat = ctx.createPattern(TX.noise, 'repeat');
  TX.cafe = makeCafeBg(17, .85);
  TX.cafe2 = makeCafeBg(29, .2);
  TX.win = makeWindowBg();
  TX.logoBg = makeLogoBg();
  buf = mk(W, H); bctx = buf.getContext('2d');
  VIG = rgr(ctx, 540, 900, 520, 540, 960, 1280, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.45)']]);
  initS1(); initS2(); initS3();
}
async function boot() {
  fit(); new ResizeObserver(fit).observe(app); window.addEventListener('resize', fit);
  const img = new Image(); const imgP = new Promise(res => { img.onload = () => { logoImg = img; res(); }; img.onerror = res; }); img.src = LOGO_SRC;
  const fonts = document.fonts ? Promise.all([
    document.fonts.load(F.disp(70, 600)), document.fonts.load(F.ital(48, 500)), document.fonts.load(F.ital(66, 600)), document.fonts.load(F.mono(28, 700)), document.fonts.load(F.mono(20, 500))
  ]).catch(() => { }) : Promise.resolve();
  await Promise.race([Promise.all([fonts, imgP]), new Promise(r => setTimeout(r, 2500))]);
  build(); ready = true; dirty = true;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { bigplay.hidden = false; frame.classList.remove('idle'); updateUI(); }
  else play();
  requestAnimationFrame(loop);
}
boot();
})();
